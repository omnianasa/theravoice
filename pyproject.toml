[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theravoice"
version = "0.1.0"
description = "Open-source assistive speech/communication monitoring companion (non-diagnostic)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TheraVoice Contributors" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
theravoice = "theravoice.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/theravoice"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
